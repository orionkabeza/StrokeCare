# Owner: Orion Kabeza (DevOps)
# Production-style stack for one small server (used for the Oracle Cloud pilot, see docs/DEPLOY_ORACLE.md).
# Only Caddy is reachable from the internet (ports 80 and 443, automatic HTTPS). The database has no published port.
# Run:  cp deploy/.env.prod.example .env && edit .env && docker compose -f docker-compose.prod.yml up -d --build
# Pilot with fictional data only. Do not put real patient data on it (docs/OPEN_QUESTIONS.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: strokecare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: strokecare
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strokecare"]
      interval: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgres://strokecare:${POSTGRES_PASSWORD}@db:5432/strokecare
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},localhost
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      NUM_PROXIES: "1"
      CRON_SECRET: ${CRON_SECRET:-}
      ALLOW_DEMO_DATA: ${ALLOW_DEMO_DATA:-0}
    healthcheck:
      # Django forces HTTPS when debug is off, so tell it the request already came in over HTTPS.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/healthz', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment: *env
    command: ["python", "manage.py", "run_scheduler", "--interval", "900"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pgdata:
  caddy_data:
  caddy_config:
