# Owner: Orion Kabeza (DevOps) · AI-assisted draft, see AI_USE_LOG.md
# A free scheduler for hosts without background workers: every 15 minutes, ask the app to run its jobs.
# Set two repository secrets: STROKECARE_URL (e.g. https://strokecare.example.org) and CRON_SECRET (same value as
# the app's CRON_SECRET). Until both exist, this workflow does nothing. GitHub may delay scheduled runs at busy times.
name: Scheduler
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Run the app's background jobs
        env:
          URL: ${{ secrets.STROKECARE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Secrets not set: skipping."; exit 0; fi
          curl -fsS --max-time 60 -X POST "$URL/api/v1/internal/jobs/run/" -H "X-Cron-Secret: $SECRET"
