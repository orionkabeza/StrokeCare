# Owner: Orion Kabeza (DevOps) · AI-assisted draft, see AI_USE_LOG.md
# Used by devcontainer.json. Two containers: `app` (where you work) and `db` (PostgreSQL 16).
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: strokecare
      POSTGRES_PASSWORD: strokecare
      POSTGRES_DB: strokecare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strokecare"]
      interval: 5s
      retries: 12

volumes:
  pgdata:
