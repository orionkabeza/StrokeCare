[pytest]
DJANGO_SETTINGS_MODULE = strokecare.settings
python_files = test_*.py
addopts = -q
env =
    DJANGO_SECRET_KEY=test-only-secret
    DJANGO_DEBUG=1
    D:DATABASE_URL=postgres://strokecare:strokecare@localhost:5432/strokecare
    THROTTLE_LOGIN=1000/min
    THROTTLE_REGISTER=1000/min
    THROTTLE_REDEEM=1000/min
